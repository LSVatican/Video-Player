<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <!-- Ganti 'favicon.png' dengan nama file gambar yang Anda import di Spck Editor -->
    <link rel="icon" type="image/png" href="/favicon.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Watermark -->
    <div class="watermark">by Daus XD</div>

    <!-- Header & Tombol Upload -->
    <header>
    <div class="logo"><i class="fas fa-play-circle"></i> Video Player</div>
    <div class="header-buttons">
        <button id="openRatingBtn" class="btn-rating"><i class="fas fa-star"></i> Beri Rating</button>
        <button id="openUploadBtn" class="btn-glow"><i class="fas fa-upload"></i> Unggah Video</button>
    </div>
</header>

    <!-- Main Container -->
    <main class="player-container">
        <!-- Background Video Area -->
        <div id="videoWrapper" class="video-wrapper">
            <div class="placeholder-text">Belum ada video yang dimuat. Silakan unggah video terlebih dahulu.</div>
            
            <!-- Player untuk Lokal -->
            <video id="localPlayer" controls></video>
            
            <!-- Player untuk YouTube / TikTok -->
            <iframe id="embedPlayer" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <!-- Alat Pengontrol Kustom (Di bawah background video) -->
        <div id="customControls" class="custom-controls">
            <button id="closeVideoBtn" class="btn-close-video" disabled>
                <i class="fas fa-times-circle"></i> Close Video
            </button>
        </div>
    </main>

    <!-- Pop Up Unggah Video -->
    <div id="uploadPopup" class="popup-overlay">
        <div class="popup-content">
            <div class="popup-header">
                <h3><i class="fas fa-cloud-upload-alt"></i> Unggah Video</h3>
                <button id="closePopupBtn" class="close-popup-x">&times;</button>
            </div>

            <!-- Tab Menu -->
            <div class="tab-menu">
                <button class="tab-btn active" data-tab="tab-lokal"><i class="fas fa-file-video"></i> Perangkat</button>
                <button class="tab-btn" data-tab="tab-youtube"><i class="fab fa-youtube"></i> YouTube</button>
                <button class="tab-btn" data-tab="tab-tiktok"><i class="fab fa-tiktok"></i> TikTok</button>
            </div>

            <!-- Isi Tab -->
            <div class="tab-container">
                <!-- Tab Perangkat -->
                <div id="tab-lokal" class="tab-content active">
                    <p>Pilih file video dari penyimpanan perangkat Anda:</p>
                    <input type="file" id="localInput" accept="video/*">
                    <button id="confirmLocalBtn" class="btn-confirm">Konfirmasi</button>
                </div>

                <!-- Tab YouTube -->
                <div id="tab-youtube" class="tab-content">
                    <p>Masukkan link video YouTube:</p>
                    <input type="url" id="youtubeInput" placeholder="https://www.youtube.com/watch?v=... atau https://youtu.be/...">
                    <button id="confirmYoutubeBtn" class="btn-confirm">Konfirmasi</button>
                </div>

                <!-- Tab TikTok -->
                <div id="tab-tiktok" class="tab-content">
                    <p>Masukkan link video TikTok:</p>
                    <input type="url" id="tiktokInput" placeholder="https://www.tiktok.com/@user/video/... atau https://vm.tiktok.com/...">
                    <button id="confirmTiktokBtn" class="btn-confirm">Konfirmasi</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="ratingPopup" class="popup-bottom-overlay">
    <div class="popup-bottom-content">
        <div class="popup-bottom-header">
            <h3><i class="fas fa-star-half-alt"></i> Beri Rating Website</h3>
            <button id="closeRatingPopupBtn" class="close-popup-x">&times;</button>
        </div>
        
        <form id="ratingForm">
            <p>Pilih Rating:</p>
            <div class="star-rating">
                <input type="radio" name="stars" id="star5" value="5 Bintang"><label for="star5" class="fas fa-star"></label>
                <input type="radio" name="stars" id="star4" value="4 Bintang"><label for="star4" class="fas fa-star"></label>
                <input type="radio" name="stars" id="star3" value="3 Bintang"><label for="star3" class="fas fa-star"></label>
                <input type="radio" name="stars" id="star2" value="2 Bintang"><label for="star2" class="fas fa-star"></label>
                <input type="radio" name="stars" id="star1" value="1 Bintang"><label for="star1" class="fas fa-star"></label>
            </div>

            <p style="margin-top: 15px;">Rating Kustom / Masukan Tambahan (Anonim):</p>
            <textarea id="customFeedback" name="feedback" placeholder="Tulis kritik, saran, atau rating kustom Anda di sini..." rows="4"></textarea>

            <button type="submit" id="submitRatingBtn" class="btn-confirm" style="margin-top: 15px;">Kirim Rating</button>
        </form>
    </div>
</div>

    <script src="script.js"></script>
</body>
</html>
