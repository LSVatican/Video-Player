<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <!-- Favicon dari gambar yang diimpor di Spck Editor -->
    <link rel="icon" href="/favicon.jpg" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Atas -->
    <header>
        <div class="logo-area">
            <h1>Video Player</h1>
            <span class="watermark">by Daus XD</span>
        </div>
        <!-- Tombol pemicu pop up di kanan atas -->
        <button id="open-upload-btn" class="btn-primary">Unggah Video</button>
    </header>
    
    <!-- Banner Penawaran Unduh APK -->
<div id="apk-banner" style="display: none; background: #12121a; border: 1px solid #00f2fe; padding: 10px; text-align: center; color: white;">
    <span>Nikmati pengalaman lebih lancar dengan aplikasi Android!</span>
    <a href="VideoPlayer.apk" class="btn-primary" style="margin-left: 10px; text-decoration: none; display: inline-block; padding: 5px 10px; font-size: 12px;">Unduh APK</a>
</div>

    <!-- Konten Utama Halaman Beranda -->
    <main>
        <!-- Tempat memutar video / Background khusus -->
        <div id="player-container" class="empty-state">
            <div id="placeholder-text">Belum ada video yang diputar. Silakan unggah video!</div>
            <!-- Wrapper dinamis untuk video player -->
            <div id="video-wrapper"></div>
        </div>

        <!-- Alat pengontrol berada di bawah background video -->
        <div id="control-panel">
            <button id="close-video-btn" class="btn-danger" disabled>Close Video</button>
        </div>
    </main>

    <!-- Halaman Pop-Up Khusus (Modal) -->
    <div id="upload-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Pilih Sumber Video</h2>
                <span id="close-modal-btn" class="close-btn">&times;</span>
            </div>
            
            <!-- Tab Menu -->
            <div class="modal-tabs">
                <button class="tab-btn active" data-tab="device-tab">Perangkat</button>
                <button class="tab-btn" data-tab="youtube-tab">YouTube</button>
                <button class="tab-btn" data-tab="tiktok-tab">TikTok</button>
            </div>
            
            <!-- Konten Tab 1: Perangkat -->
            <div class="tab-content active" id="device-tab">
                <p>Pilih file video dari galeri penyimpanan perangkat Anda:</p>
                <input type="file" id="device-video-input" accept="video/*">
                <button id="confirm-device-btn" class="btn-success">Konfirmasi</button>
            </div>

            <!-- Konten Tab 2: YouTube -->
            <div class="tab-content" id="youtube-tab">
                <p>Masukkan link video YouTube:</p>
                <input type="text" id="youtube-link-input" placeholder="https://www.youtube.com/watch?v=... atau https://youtu.be/...">
                <button id="confirm-youtube-btn" class="btn-success">Konfirmasi</button>
            </div>

            <!-- Konten Tab 3: TikTok -->
            <div class="tab-content" id="tiktok-tab">
                <p>Masukkan link video TikTok:</p>
                <input type="text" id="tiktok-link-input" placeholder="https://www.tiktok.com/@username/video/...">
                <button id="confirm-tiktok-btn" class="btn-success">Konfirmasi</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
